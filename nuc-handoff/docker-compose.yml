# iBOARD on a NUC (Docker).
# Publishes HTTP + Socket.IO on school-friendly TCP 80 (no TLS / no 443).
# App listens on 3001 inside the container; host maps 80 → 3001.
#
# After loading the image tar:
#   docker compose up -d
# Open http://<nuc-ip>/

services:
  iboard:
    image: iboard:poc
    container_name: iboard-poc
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATA_DIR: /data
    volumes:
      - iboard-data:/data
    ports:
      - "80:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  iboard-data:
