# iBOARD proof-of-concept on a NUC (or any Linux box with Docker).
# Usage (after loading the image tar):
#   docker compose up -d
# Then open http://<nuc-ip>:3001

services:
  iboard:
    image: iboard:poc
    container_name: iboard-poc
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATA_DIR: /data
    volumes:
      - iboard-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  iboard-data:
