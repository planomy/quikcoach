<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('quik-coach-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/brand/tuit-mark.png?v=9" />
    <link rel="apple-touch-icon" href="/brand/tuit-mark.png?v=9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUIT</title>
  </head>
  <body class="antialiased bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <div id="tuit-overlay-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
